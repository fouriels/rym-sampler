<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // apply the saved theme before first paint, so there is no flash of the wrong one (dark is the default)
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", ["light", "dark", "dark-classic"].indexOf(t) >= 0 ? t : "dark");
      } catch (e) {}
    </script>
    <title>Every Genre on RateYourMusic &mdash; By the Numbers</title>

    <meta
      name="description"
      content="An interactive dashboard covering every genre sampled in the RYM Genre Sampler video: popularity, taxonomy, dates, countries, track length and more."
    />
  </head>
